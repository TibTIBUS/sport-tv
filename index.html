<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sport TV — Ma séance</title><link rel="stylesheet" href="style.css"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101918'/%3E%3Cpath d='M8 11v10m16-10v10M8 16h16' stroke='%23cafa68' stroke-width='4'/%3E%3C/svg%3E"></head><body><header><strong>SPORT TV</strong><span>Ma routine du matin</span><button id="fullscreen">Plein écran</button></header><main><section id="setup"><p class="eyebrow">SÉANCE DU JOUR</p><h1>Un peu plus fort,<br>séance après séance.</h1><div class="settings"><label>Jour<select id="day"></select></label><label>Temps disponible<select id="duration"><option value="20">20 minutes</option><option value="25" selected>25 minutes</option><option value="30">30 minutes</option></select></label><label>Forme<select id="energy"><option value="good">Bonne</option><option value="medium">Moyenne</option><option value="tired">Fatigué</option></select></label><label>Genou<select id="knee"><option value="ok">Rien à signaler</option><option value="discomfort">Gêne</option><option value="pain">Douleur</option></select></label><label>Course dans les dernières 24 h<select id="run"><option value="no">Non</option><option value="yes">Oui</option></select></label></div><h2 id="title"></h2><p id="summary"></p><p id="notice" role="status"></p><button class="primary" id="start" disabled>Commencer</button><details><summary>Voir les exercices</summary><ol id="preview"></ol></details></section><section id="player" hidden><p class="eyebrow" id="phase"></p><div class="work"><div><h1 id="exercise"></h1><p id="cue"></p><p id="target"></p></div><div id="clock" role="timer" aria-label="Temps restant"></div></div><progress id="progress" max="100" value="0" aria-label="Progression de la séance"></progress><p id="next"></p><div class="actions"><button class="primary" id="pause">Pause</button><button id="skip">Passer</button><button id="easy">Plus facile</button><button id="stop">Arrêter</button></div><p class="muted">Espace : pause · Flèche droite : passer · Arrête si une douleur apparaît.</p></section><section id="finish" hidden><p class="eyebrow">BILAN</p><h1 id="result"></h1><label>Difficulté<select id="difficulty"><option>Adaptée</option><option>Trop facile</option><option>Trop difficile</option></select></label><label>Genou pendant la séance<select id="feedback-knee"><option>Rien à signaler</option><option>Gêne</option><option>Douleur</option></select></label><button id="download" class="primary">Télécharger mon bilan</button><button id="back">Retour au programme</button><p class="muted">Le bilan reste sur cet appareil. Transmets le fichier à Hermès pour adapter les prochaines séances.</p></section><p id="error" role="alert"></p></main><script type="module" src="app.js"></script></body></html>
